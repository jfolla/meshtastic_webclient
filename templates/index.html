<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meshtastic Web Chat</title>
  <style>
    body{font-family:Arial,sans-serif;margin:0;background:#f5f7fa;color:#1f2937}
    header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#111827;color:#fff}
    .wrap{display:grid;grid-template-columns:1fr 320px;gap:16px;padding:16px}
    .card{background:#fff;border-radius:12px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
    .messages{height:60vh;overflow:auto;border:1px solid #e5e7eb;border-radius:8px;padding:8px;background:#fafafa}
    .msg{padding:8px;border-bottom:1px solid #e5e7eb}
    .meta{font-size:12px;color:#6b7280}
    .controls{display:flex;gap:8px;margin-top:12px}
    input,select,button,textarea{font:inherit}
    textarea{flex:1;min-height:70px;padding:8px}
    button{padding:8px 12px;border:0;border-radius:8px;background:#2563eb;color:#fff;cursor:pointer}
    button.secondary{background:#6b7280}
    .stat{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #f0f0f0}
    .section-title{margin:0 0 8px 0;font-size:18px}
    .toolbar{display:flex;gap:8px;align-items:center}
    .status-badge{padding:4px 8px;border-radius:999px;background:#e5e7eb;color:#111827;font-size:12px}
    .status-ok{background:#dcfce7;color:#166534}.status-bad{background:#fee2e2;color:#991b1b}
    @media (max-width: 960px){.wrap{grid-template-columns:1fr}}
  </style>
</head>
<body>
<header>
  <div>
    <strong id="title">Meshtastic Web Chat</strong>
    <span id="version">v{{ version }}</span>
  </div>
  <div class="toolbar">
    <label for="lang-select" id="lang-label">Language</label>
    <select id="lang-select">
      <option value="en">English</option>
      <option value="it">Italiano</option>
      <option value="fr">Français</option>
    </select>
  </div>
</header>
<div class="wrap">
  <div class="card">
    <h2 class="section-title" data-i18n="messages">Messages</h2>
    <div id="messages" class="messages"></div>
    <div class="controls">
      <textarea id="message-input" placeholder="Type a message"></textarea>
    </div>
    <div class="controls">
      <input id="destination-input" placeholder="Optional destination node id">
      <button id="send-btn" data-i18n="send">Send</button>
      <button id="clear-btn" class="secondary" data-i18n="clear">Clear</button>
    </div>
  </div>
  <div class="card">
    <h2 class="section-title" data-i18n="stats">Statistics</h2>
    <div id="status-badge" class="status-badge">-</div>
    <div class="stat"><span data-i18n="backend">Backend connected to node</span><strong id="backend-connected">-</strong></div>
    <div class="stat"><span>Proxy connected</span><strong id="proxy-connected">-</strong></div>
    <div class="stat"><span data-i18n="proxyError">Proxy error</span><strong id="proxy-error">-</strong></div>
    <div class="stat"><span data-i18n="lastPacket">Last packet</span><strong id="last-packet">-</strong></div>
    <div class="stat"><span data-i18n="packetsRx">Packets received</span><strong id="packets-rx">0</strong></div>
    <div class="stat"><span data-i18n="relaySeen">Relay observed</span><strong id="relay-seen">0</strong></div>
    <div class="stat"><span data-i18n="relayTx">Relay sent by node</span><strong id="relay-tx">0</strong></div>
    <div class="stat"><span data-i18n="packetsBad">Corrupted packets</span><strong id="packets-bad">0</strong></div>
    <div class="stat"><span data-i18n="dropped">Dropped</span><strong id="dropped">0</strong></div>
    <div class="stat"><span data-i18n="battery">Battery</span><strong id="battery">-</strong></div>
    <div class="stat"><span data-i18n="voltage">Voltage</span><strong id="voltage">-</strong></div>
    <h3 class="section-title" data-i18n="nodes">Nodes</h3>
    <div id="nodes"></div>
  </div>
</div>
<script>
const I18N = {{ i18n|safe }};
let currentLang = localStorage.getItem('lang') || navigator.language.slice(0,2) || 'en';
if (!I18N[currentLang]) currentLang = 'en';
document.getElementById('lang-select').value = currentLang;
function t(k){return (I18N[currentLang]||I18N.en)[k] || k;}
function applyI18n(){document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=t(el.dataset.i18n)});document.title=t('title');document.getElementById('title').textContent=t('title');localStorage.setItem('lang',currentLang);} 
document.getElementById('lang-select').addEventListener('change',e=>{currentLang=e.target.value;applyI18n();});
applyI18n();
async function fetchJson(url, options){const r=await fetch(url, options);if(!r.ok) throw new Error(await r.text());return await r.json();}
function renderMessages(items){const box=document.getElementById('messages');box.innerHTML='';for(const m of items){const div=document.createElement('div');div.className='msg';div.innerHTML=`<div class="meta">${m.ts||''} · ${m.from_id||''} → ${m.to_id||''}</div><div>${(m.text||'').replace(/</g,'&lt;')}</div>`;box.appendChild(div);} box.scrollTop=box.scrollHeight;}
function renderNodes(items){const box=document.getElementById('nodes');box.innerHTML='';for(const n of items){const div=document.createElement('div');div.className='stat';div.innerHTML=`<span>${n.name||n.node_id}</span><strong>${n.short_name||''}</strong>`;box.appendChild(div);} }
function setText(id,val){document.getElementById(id).textContent=(val===undefined||val===null||val==='')?'-':String(val);} 
async function refresh(){try{const [status,stats,msgs,nodes] = await Promise.all([fetchJson('/api/status'),fetchJson('/api/stats'),fetchJson('/api/messages'),fetchJson('/api/nodes')]);
setText('backend-connected', status.backend_connected ? t('online') : t('offline'));
setText('proxy-connected', status.proxy_connected ? t('online') : t('offline'));
setText('proxy-error', status.proxy_error || '-');
setText('last-packet', stats.last_packet_at || '-');
setText('packets-rx', stats.packets_rx || 0);
setText('relay-seen', stats.relay_seen || 0);
setText('relay-tx', stats.tx_relay || 0);
setText('packets-bad', stats.packets_rx_bad || 0);
setText('dropped', stats.tx_dropped || 0);
setText('battery', stats.battery_level);
setText('voltage', stats.voltage);
renderMessages(msgs);renderNodes(nodes);
const badge=document.getElementById('status-badge');badge.textContent=status.backend_connected ? t('online') : t('offline');badge.className='status-badge ' + (status.backend_connected ? 'status-ok':'status-bad');
}catch(e){console.error(e)}}
document.getElementById('send-btn').addEventListener('click', async ()=>{const text=document.getElementById('message-input').value.trim();const destination_id=document.getElementById('destination-input').value.trim();if(!text)return;await fetchJson('/api/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,destination_id:destination_id||null})});document.getElementById('message-input').value='';refresh();});
document.getElementById('clear-btn').addEventListener('click', async ()=>{await fetchJson('/api/clear',{method:'POST'});refresh();});
refresh();setInterval(refresh,5000);
</script>
</body>
</html>
