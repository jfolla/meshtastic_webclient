<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meshtastic Web Chat</title>
  <style>
    :root {
      --bg: #0b1220;
      --panel: #121a2b;
      --panel-2: #182237;
      --text: #e7ecf5;
      --muted: #9fb0ca;
      --accent: #57b3ff;
      --accent-2: #7cf29a;
      --border: #26324c;
      --danger: #ff8d8d;
      --shadow: 0 10px 30px rgba(0,0,0,.25);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: linear-gradient(180deg,#0a1020,#0d1527 35%,#0c1422); color: var(--text); font-family: Inter, system-ui, sans-serif; }
    header { padding: 20px 24px; border-bottom: 1px solid var(--border); background: rgba(7,12,22,.6); backdrop-filter: blur(8px); position: sticky; top: 0; z-index: 10; }
    header h1 { margin: 0; font-size: 1.4rem; }
    header p { margin: 6px 0 0; color: var(--muted); font-size: .95rem; }
    .wrap { display: grid; grid-template-columns: 1.7fr 1fr; gap: 18px; padding: 18px; }
    .card { background: linear-gradient(180deg,var(--panel),var(--panel-2)); border: 1px solid var(--border); border-radius: 18px; box-shadow: var(--shadow); }
    .section-title { margin: 0 0 14px; font-size: 1rem; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
    .chat { display: flex; flex-direction: column; min-height: 70vh; }
    .messages { flex: 1; padding: 18px; overflow: auto; max-height: 72vh; }
    .bubble { padding: 12px 14px; border-radius: 14px; margin-bottom: 12px; background: rgba(255,255,255,.03); border: 1px solid var(--border); }
    .bubble.out { background: rgba(87,179,255,.12); border-color: rgba(87,179,255,.35); }
    .meta { font-size: .78rem; color: var(--muted); margin-bottom: 6px; }
    .text { white-space: pre-wrap; line-height: 1.45; }
    .composer { display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: 16px; border-top: 1px solid var(--border); }
    input[type=text], input[type=file], textarea { width: 100%; background: rgba(255,255,255,.03); border: 1px solid var(--border); color: var(--text); padding: 12px 14px; border-radius: 12px; }
    button { border: 0; border-radius: 12px; padding: 12px 16px; cursor: pointer; background: var(--accent); color: #031220; font-weight: 700; }
    button.secondary { background: rgba(255,255,255,.05); color: var(--text); border: 1px solid var(--border); }
    .side { padding: 18px; display: grid; gap: 18px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .stat { padding: 12px; border: 1px solid var(--border); border-radius: 14px; background: rgba(255,255,255,.03); }
    .stat .label { color: var(--muted); font-size: .78rem; margin-bottom: 4px; }
    .stat .value { font-size: 1.05rem; font-weight: 700; }
    .ok { color: var(--accent-2); }
    .bad { color: var(--danger); }
    ul.nodes { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
    ul.nodes li { padding: 10px 12px; border: 1px solid var(--border); border-radius: 12px; background: rgba(255,255,255,.03); }
    .toolbar { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
    .hint { color: var(--muted); font-size: .9rem; }
    @media (max-width: 980px) { .wrap { grid-template-columns: 1fr; } .chat { min-height: auto; } .messages { max-height: 50vh; } }
  </style>
</head>
<body>
  <header>
    <h1>Meshtastic Web Chat</h1>
    <p>Single-service proxy-first local web interface for Meshtastic nodes.</p>
  </header>
  <div class="wrap">
    <section class="card chat">
      <div class="messages" id="messages"></div>
      <div class="composer">
        <input id="messageInput" type="text" placeholder="Write a broadcast message...">
        <button id="sendBtn">Send</button>
      </div>
    </section>
    <aside class="card side">
      <div>
        <h2 class="section-title">Status</h2>
        <div class="grid" id="statsGrid"></div>
        <div class="toolbar">
          <button class="secondary" id="refreshBtn">Refresh</button>
          <button class="secondary" id="clearBtn">Clear cache</button>
        </div>
      </div>
      <div>
        <h2 class="section-title">Nodes</h2>
        <ul class="nodes" id="nodes"></ul>
      </div>
      <div>
        <h2 class="section-title">Configuration</h2>
        <div class="toolbar">
          <button class="secondary" id="exportCfgBtn">Export config</button>
          <label class="secondary" style="display:inline-flex;align-items:center;gap:8px;padding:12px 16px;cursor:pointer;">
            Import config
            <input id="importCfgInput" type="file" accept="application/json" style="display:none;">
          </label>
        </div>
        <p class="hint">Importing a config replaces <code>app_config.json</code>. Restart the service after import.</p>
      </div>
      <div>
        <h2 class="section-title">Debug</h2>
        <pre id="debugBox" style="margin:0;white-space:pre-wrap;word-break:break-word;color:var(--muted);"></pre>
      </div>
    </aside>
  </div>
  <script>
    async function getJson(url, opts) {
      const res = await fetch(url, opts);
      if (!res.ok) {
        throw new Error(`HTTP ${res.status}`);
      }
      return await res.json();
    }

    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch]));
    }

    function renderMessages(items) {
      const box = document.getElementById('messages');
      box.innerHTML = items.map(m => `
        <div class="bubble ${m.direction === 'out' ? 'out' : ''}">
          <div class="meta">${esc(m.ts)} · ${esc(m.from_id || '')} → ${esc(m.to_id || '')}</div>
          <div class="text">${esc(m.text || '')}</div>
        </div>`).join('');
      box.scrollTop = box.scrollHeight;
    }

    function renderNodes(items) {
      const box = document.getElementById('nodes');
      if (!items.length) {
        box.innerHTML = '<li>No nodes cached yet.</li>';
        return;
      }
      box.innerHTML = items.map(n => `<li><strong>${esc(n.name)}</strong><br><span class="hint">${esc(n.node_id)} · ${esc(n.hw_model || '')}</span></li>`).join('');
    }

    function renderStats(status, state, messages) {
      const stats = [
        ['Version', status.version || '-'],
        ['Proxy', status.proxy_connected ? 'Connected' : 'Disconnected'],
        ['Backend', status.backend_connected ? 'Connected' : 'Disconnected'],
        ['Messages cached', messages.length],
        ['Messages RX', state.messages_rx ?? 0],
        ['Messages TX', state.messages_tx ?? 0],
        ['Packets RX seen', state.packets_rx_seen ?? 0],
        ['Relay seen (estimate)', state.relay_seen_estimate ?? 0],
        ['Multi-hop seen (estimate)', state.multi_hop_seen_estimate ?? 0],
        ['Known nodes', (state.nodes || []).length],
        ['Last sync', status.last_sync || '-'],
        ['Last packet', state.last_packet_at || '-']
      ];
      document.getElementById('statsGrid').innerHTML = stats.map(([k,v]) => `
        <div class="stat"><div class="label">${esc(k)}</div><div class="value ${String(v).includes('Disconnected') ? 'bad' : ''}">${esc(v)}</div></div>
      `).join('');
    }

    async function refreshAll() {
      const [status, state, nodes, messages, debug] = await Promise.all([
        getJson('/api/status'),
        getJson('/api/state'),
        getJson('/api/nodes'),
        getJson('/api/messages?limit=100'),
        getJson('/api/debug')
      ]);
      renderMessages(messages);
      renderNodes(nodes);
      renderStats(status, state, messages);
      document.getElementById('debugBox').textContent = JSON.stringify(debug, null, 2);
    }

    document.getElementById('sendBtn').addEventListener('click', async () => {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (!text) return;
      await fetch('/api/send', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({text})
      });
      input.value = '';
      await refreshAll();
    });

    document.getElementById('messageInput').addEventListener('keydown', async (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        document.getElementById('sendBtn').click();
      }
    });

    document.getElementById('refreshBtn').addEventListener('click', refreshAll);
    document.getElementById('clearBtn').addEventListener('click', async () => {
      await fetch('/api/clear', {method: 'POST'});
      await refreshAll();
    });
    document.getElementById('exportCfgBtn').addEventListener('click', () => {
      window.location.href = '/api/config/export';
    });
    document.getElementById('importCfgInput').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const fd = new FormData();
      fd.append('file', file);
      const res = await fetch('/api/config/import', {method: 'POST', body: fd});
      const data = await res.json();
      alert(data.message || data.error || 'Done');
    });

    refreshAll().catch(console.error);
    setInterval(() => refreshAll().catch(console.error), 5000);
  </script>
</body>
</html>
